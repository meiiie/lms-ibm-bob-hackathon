name: Demo CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for the current main revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  pages:
    if: >-
      github.repository == 'meiiie/lms-ibm-bob-hackathon' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.21.0'
      - name: Verify trusted CI and current main
        id: release
        run: node scripts/demo-release.mjs
      - name: Download the exact tested artifact
        if: steps.release.outputs.current == 'true'
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name demo-pages --dir .tools/demo-pages
      - name: Validate assets and service-worker hashes
        if: steps.release.outputs.current == 'true'
        run: node scripts/build-demo-pages.mjs --check-only
      - name: Add public revision marker
        if: steps.release.outputs.current == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(".tools/demo-pages/__demo-release.json", JSON.stringify({commit:process.env.RELEASE_SHA,ciRun:process.env.CI_RUN_ID,deployRun:process.env.GITHUB_RUN_ID})+"\n")'
      - name: Recheck main before deployment
        if: steps.release.outputs.current == 'true'
        id: final
        run: node scripts/demo-release.mjs
      - name: Deploy Cloudflare Pages
        if: steps.final.outputs.current == 'true'
        working-directory: deploy/demo-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7cec31eaddd4eb5858167c4aa7d0bca
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          npx --yes wrangler@4.141.0 pages deploy ../../.tools/demo-pages --project-name neko-core-lms-demo --branch main --commit-hash "$RELEASE_SHA" --commit-dirty=false
      - name: Verify public revision and backend health
        if: steps.final.outputs.current == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "https://neko-core-lms-demo.pages.dev/__demo-release.json?run=$GITHUB_RUN_ID" | jq -e --arg sha "$RELEASE_SHA" '.commit == $sha'; then break; fi
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 5
          done
          curl -fsS --retry 3 --max-time 30 https://lms-api-production-ff2e.up.railway.app/actuator/health | jq -e '.status == "UP"'
          echo "Deployed $RELEASE_SHA from CI $CI_RUN_ID to https://neko-core-lms-demo.pages.dev" >> "$GITHUB_STEP_SUMMARY"
